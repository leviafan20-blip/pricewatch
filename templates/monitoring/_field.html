<div class="monitor-field">
  <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span aria-hidden="true"> *</span>{% endif %}</label>
  {{ field }}
  <div class="form-text" id="{{ field.id_for_label }}_help">{{ field.help_text }}</div>
  {% for error in field.errors %}<div class="invalid-feedback d-block" role="alert">{{ error }}</div>{% endfor %}
</div>
