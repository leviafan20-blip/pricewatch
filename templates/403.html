{% extends "base.html" %}
{% block title %}Доступ ограничен — PriceWatch{% endblock %}
{% block content %}

    <section class="error-card" aria-labelledby="error-title">
      <p class="eyebrow">Ошибка 403</p>
      <h1 id="error-title">Доступ ограничен</h1>

      <a class="btn btn-primary" href="{% url 'core:dashboard' %}">Перейти в кабинет</a>
    </section>
  </div>
{% endblock %}
